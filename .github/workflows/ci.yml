name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    name: Analyze, format and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.0
          cache: true

      # AGP 9.x requires a JDK 21 floor; 17 breaks the Android build.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        run: flutter analyze

      - name: Widget tests
        run: flutter test

      - name: Kotlin engine tests
        run: |
          cd android
          ./gradlew :app:testDebugUnitTest

      # The release type (R8, resources, manifest merge, signing config) must
      # compile on every push; unsigned release APK, debug-key fallback.
      - name: Build release APK
        run: flutter build apk --release
